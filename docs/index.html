<style>
:root {
  --bg: #f6f7fb; --card: #ffffff; --txt: #1c1e26; --dim: #636a7a; --line: #e2e5ee;

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #14161c; --card: #1f222b; --txt: #eceef2; --dim: #9aa1b0; --line: #30343f; }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--txt); font: 17px/1.6 "Segoe UI", system-ui, -apple-system, "Microsoft YaHei UI", "Yu Gothic UI", sans-serif; }
a { color: var(--accent); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }

/* barre du haut */
header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; text-decoration: none; color: var(--txt); }
.brand img { width: 36px; height: 36px; }
select { font: inherit; font-size: 15px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--txt); }

/* accueil */
.hero { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 40px; align-items: center; padding: 40px 0 60px; }
.hero h1 { font-size: clamp(40px, 7vw, 68px); line-height: 1.05; margin: 0 0 10px; letter-spacing: -1px; }
.hero h1 span { color: var(--accent); }
.tag { font-size: clamp(20px, 3vw, 26px); font-weight: 600; margin: 0 0 14px; }
.lead { color: var(--dim); margin: 0 0 26px; font-size: 18px; }
.btn { display: inline-flex; align-items: center; gap: 10px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; font-size: 19px;
  padding: 16px 28px; border-radius: 16px; box-shadow: 0 8px 24px rgba(79,107,255,.35); transition: transform .15s, box-shadow .15s; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(79,107,255,.45); }
.btn svg { width: 22px; height: 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.chip { background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; font-size: 14px; color: var(--dim); }
.shot { justify-self: center; position: relative; }
.shot img { width: 100%; max-width: 340px; border-radius: 14px; box-shadow: 0 20px 50px rgba(20,30,80,.25); display: block; }
.shot .baby { position: absolute; width: 96px; right: -48px; top: -64px; animation: float 4s ease-in-out infinite; filter: drop-shadow(0 8px 14px rgba(20,30,80,.3)); }
@keyframes float { 50% { transform: translateY(-10px) rotate(-6deg); } }

/* sections */
section { padding: 50px 0; }
h2 { font-size: clamp(26px, 4vw, 36px); margin: 0 0 24px; text-align: center; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
.card .ico { font-size: 34px; }
.card h3 { margin: 8px 0 6px; font-size: 20px; }
.card p { margin: 0; color: var(--dim); font-size: 16px; }

.story { background: linear-gradient(135deg, #4f6bff, #2c3eaa); color: #fff; border-radius: 24px; padding: 40px; display: grid; grid-template-columns: 120px 1fr; gap: 30px; align-items: center; }
.story img { width: 120px; }
.story h2 { text-align: left; margin-bottom: 12px; }
.story p { margin: 0 0 12px; font-size: 18px; }
.story .sign { font-weight: 700; color: var(--yellow); }

ol.steps { counter-reset: s; list-style: none; padding: 0; max-width: 720px; margin: 0 auto; }
ol.steps li { counter-increment: s; position: relative; padding: 14px 0 14px 60px; border-bottom: 1px solid var(--line); }
ol.steps li::before { content: counter(s); position: absolute; left: 0; top: 12px; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; display: grid; place-items: center; }

details { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; margin: 0 auto 10px; max-width: 720px; }
summary { cursor: pointer; font-weight: 600; }
details p { color: var(--dim); margin: 10px 0 0; }

footer { border-top: 1px solid var(--line); margin-top: 40px; padding: 30px 0 50px; color: var(--dim); font-size: 14px; }
footer h4 { color: var(--txt); margin: 0 0 6px; font-size: 15px; }
.foot { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

@media (max-width: 760px) {
  .hero { grid-template-columns: 1fr; padding-top: 20px; text-align: center; }
  .chips { justify-content: center; }
  .shot .baby { width: 80px; right: -10px; }
  .grid3, .foot { grid-template-columns: 1fr; }
  .story { grid-template-columns: 1fr; text-align: center; padding: 28px 20px; }
  .story img { margin: 0 auto; }
  .story h2 { text-align: center; }
}
</style>

const sel = document.getElementById("lang");
function pickLang() {
  let saved = null;
  try { saved = localStorage.getItem("lang"); } catch (e) {}
  if (saved && T[saved]) return saved;
  for (const l of (navigator.languages || [navigator.language || "en"])) {
    const k = l.slice(0, 2).toLowerCase(); if (T[k]) return k;
  }
  return "en";
}
function apply(l) {
  const d = T[l];
  document.documentElement.lang = l;
  document.querySelectorAll("[data-t]").forEach(el => {
    const v = d[el.dataset.t]; if (v === undefined) return;
    if (el.hasAttribute("data-html")) el.innerHTML = v; else el.textContent = v;
  });
  document.getElementById("shot").src = "img/app-" + l + ".png";
  document.title = "Chutoki – " + d.tag.replace(/[.。]$/, "");
  sel.value = l;
}
sel.addEventListener("change", () => { try { localStorage.setItem("lang", sel.value); } catch (e) {} apply(sel.value); });

document.getElementById("ver").textContent = VERSION;
document.getElementById("dl").href = "https://github.com/" + GITHUB_USER + "/" + REPO + "/releases/latest/download/Chutoki-Free-win-x64.zip";
const m = MAIL.join("@"), a = document.getElementById("mail");
a.textContent = m; a.href = "mailto:" + m + "?subject=Chutoki";
apply(pickLang());
