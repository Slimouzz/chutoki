# Compilation automatique de Chutoki sur GitHub (nécessaire pour la signature gratuite SignPath)
# - à chaque version publiée (tag v*), ou à la demande (onglet Actions > Build > Run workflow)
# - produit le zip portable et l'installateur, téléchargeables dans les "artifacts" de l'exécution
name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Installer Inno Setup (si absent)
        shell: pwsh
        run: |
          $paths = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not ($paths | Where-Object { Test-Path $_ })) { choco install innosetup -y --no-progress }

      - name: Compiler
        shell: powershell
        run: .\build.ps1

      - name: Empreintes SHA256
        shell: pwsh
        run: Get-FileHash Chutoki-Setup.exe, Chutoki-Free-win-x64.zip -Algorithm SHA256 | Format-Table -AutoSize

      - name: Publier les fichiers compilés (artifacts)
        uses: actions/upload-artifact@v7
        with:
          name: chutoki-${{ github.ref_name }}
          path: |
            Chutoki-Setup.exe
            Chutoki-Free-win-x64.zip
          if-no-files-found: error
